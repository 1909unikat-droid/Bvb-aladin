name: Refresh BVB News

on:
  schedule:
    # Alle 30 Minuten. GitHub Actions Cron ist nicht 100% pünktlich (manchmal +5-20 min Verzögerung).
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # Manueller Trigger via GitHub UI
  push:
    branches: [main]
    paths:
      - "fetcher.py"
      - "scorer.py"
      - "vibe_history.py"
      - "data/sources.json"
      - ".github/workflows/refresh-news.yml"

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        run: python fetcher.py
        continue-on-error: false

      - name: Score & cluster
        run: python scorer.py

      # PUBLISHER-SPLIT: rumors.json + injuries.json macht AUSSCHLIESSLICH der
      # Mac (rumors_fetcher.py/injuries_fetcher.py + push_rumors.sh). TM blockt
      # die Action-IPs meist mit HTTP 202; käme sie doch durch, überschriebe sie
      # den Mac-Stand mit gejitterten Werten und beide Publisher würden sich
      # gegenseitig überschreiben — jedes Ping-Pong = ein Vercel-Deploy.
      # Deshalb hier weder ausführen noch spiegeln noch committen.
      # vibe_history.py bleibt: die Datei reist gebündelt mit news.json mit.
      - name: Update vibe history
        run: python vibe_history.py || echo "vibe history skipped"
        continue-on-error: true

      - name: Mirror data files into web/public/data (for Next.js deploy)
        run: |
          mkdir -p web/public/data
          cp data/news.json web/public/data/news.json
          if [ -f data/vibe_history.json ]; then cp data/vibe_history.json web/public/data/vibe_history.json; fi

      - name: Commit news.json (only if changed)
        run: |
          git config user.name  "bvb-aladin-bot"
          git config user.email "bvb-aladin-bot@users.noreply.github.com"
          # Nur existierende Dateien stagen — ein fehlendes Zusatz-File darf den
          # News-Commit nicht mit "pathspec did not match" abbrechen.
          # rumors.json/injuries.json stehen bewusst NICHT hier (Publisher-Split).
          # source_state.json mit committen: der Frische-Wächter braucht das
          # Gedächtnis des Vorlaufs — ein frischer Checkout hätte sonst nie
          # 2 leere Läufe in Folge (Alarm für tote Handles bliebe stumm).
          # Läuft im selben Commit wie news.json mit — kein Extra-Deploy.
          for f in data/news.json data/raw_items.json web/public/data/news.json \
                   data/vibe_history.json web/public/data/vibe_history.json \
                   data/source_state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "no changes — skipping commit"
          else
            git commit -m "chore: refresh news $(date -u +%Y-%m-%dT%H:%MZ)"
            # Der Mac pusht rumors.json via Contents-API — Race abfedern:
            git pull --rebase --autostash || true
            git push || (git pull --rebase --autostash && git push)
          fi
