name: Refresh BVB Squad (Diagnose)

# PUBLISHER-SPLIT: Die Kader-Daten publiziert AUSSCHLIESSLICH der Mac
# (squad_fetcher.py im halbstündlichen run_refresh.sh, max. 1x/Tag, danach
# push_rumors.sh → web/public/data/squad*.json).
#
# Grund: Transfermarkt blockt die Runner-IPs. Im Lauf vom 2026-08-22 sind ALLE
# Teams mit "[FAIL] … no items table found" gescheitert — inklusive profis —,
# der Fetcher ist auf die zwischengespeicherten Daten zurückgefallen und hätte
# einen Stand mit pending=true committet. Vom Mac (Residential-IP, HTTP 200)
# kommen echte 26/27-Daten mit pending=false. Ein Commit von hier würde also
# den guten Mac-Stand mit einem Fallback überschreiben — dasselbe
# Dual-Publisher-Ping-Pong, das bei rumors.json/injuries.json schon beseitigt
# wurde, und jedes Ping-Pong kostet einen Vercel-Deploy.
#
# Deshalb: kein schedule, kein push-Trigger, kein Commit-Schritt. Was bleibt,
# ist ein rein manueller Notnagel — ein Lauf zeigt in den Logs, ob TM von den
# Actions-IPs aus wieder erreichbar ist. Er schreibt nichts ins Repo.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-squad
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe Transfermarkt (Diagnose, wird NICHT committet)
        run: python squad_fetcher.py
